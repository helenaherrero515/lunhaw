name: Green Index

# Recomputes the Green Index (EQ-005) once a year after the dry season (December–May) and uploads the
# results to Supabase. Places stay published only while their new numbers still agree with their
# photo-check; anything else waits for a person to check it (scripts/green-index/validate.py).
on:
  schedule:
    - cron: "0 3 15 6 *" # 15 June, 03:00 UTC
  workflow_dispatch:
    inputs:
      season_end:
        description: "Dry season to use, by the year it ends in (e.g. 2026 = Dec 2025 – May 2026). Blank = latest."
        required: false

concurrency:
  group: green-index
  cancel-in-progress: false

jobs:
  compute:
    name: Compute and upload
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scripts/green-index
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase settings missing; skipping (see docs/RELEASE.md §2)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.config.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v6

      - name: Compute and upload
        if: steps.config.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--upload"
          if [ -n "${{ inputs.season_end }}" ]; then ARGS="$ARGS --season-end ${{ inputs.season_end }}"; fi
          uv run --locked python compute.py $ARGS

      - name: Keep the run files
        if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: green-index-run
          path: scripts/green-index/out/
          retention-days: 400

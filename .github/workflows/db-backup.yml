name: Database Backup to Cloudflare R2

# Scheduled weekly export of Supabase PostgreSQL database to Cloudflare R2 (D-M3-02)
# Executes every Sunday at 02:00 UTC. Compresses dump with gzip and enforces 30-day retention pruning.
# Traces to: D-M3-02, F-M3-02, COSTS.md, docs/DATABASE_SIZE_BUDGET.md

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (skip remote S3 mutation)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: db-backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    name: Database Backup & R2 Retention Pruning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PostgreSQL Client Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          pg_dump --version

      - name: Execute Automated Backup & R2 Upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL || '' }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL || secrets.DATABASE_URL || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'lunhaw-db-backups' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || '' }}
          BACKUP_RETENTION_DAYS: "30"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "Executing Lunhaw automated database backup to Cloudflare R2..."
          node scripts/db-backup-r2.mjs

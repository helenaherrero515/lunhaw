name: Supabase Keepalive Ping

# Scheduled workflow to prevent Supabase free-tier database from auto-pausing after 7 days of inactivity (D-M1-02).
# Executes twice a week (Monday and Thursday at 04:00 UTC).

on:
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Health Check Query via REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: |
          echo "Executing Supabase keep-alive check..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/places?select=id&limit=1" || true)
          echo "Supabase keep-alive response status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" = "200" ] || [ "${HTTP_STATUS}" = "000" ] || [ "${HTTP_STATUS}" = "401" ]; then
            echo "Keep-alive ping completed successfully."
          else
            echo "Unexpected status code: ${HTTP_STATUS}"
          fi

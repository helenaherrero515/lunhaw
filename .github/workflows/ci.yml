name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: CI Pipeline (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Workspace Linting
        run: pnpm lint

      - name: Run OpenAPI Contract Linting (Spectral)
        run: pnpm lint:api

      - name: Run TypeScript Typecheck
        run: |
          pnpm --filter @lunhaw/ui exec tsc --noEmit
          pnpm --filter @lunhaw/api exec tsc --noEmit
          pnpm --filter web exec tsc --noEmit

      - name: Run Vitest Unit & Component Tests
        run: pnpm test

      - name: Build Web Application & Packages
        run: pnpm build

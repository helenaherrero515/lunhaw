name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: CI Pipeline (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Workspace Linting
        run: pnpm lint

      - name: Run OpenAPI Contract Linting (Spectral)
        run: pnpm lint:api

      - name: Run TypeScript Typecheck
        run: |
          pnpm --filter @lunhaw/ui exec tsc --noEmit
          pnpm --filter @lunhaw/api exec tsc --noEmit
          pnpm --filter web exec tsc --noEmit

      - name: Run Vitest Unit & Component Tests
        run: pnpm test

      - name: Build Web Application & Packages
        run: pnpm build

  migrations:
    name: Database migrations (PostGIS) + release data checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generated dataset migration is up to date
        run: |
          node scripts/data/build-public-release-seed.mjs
          git diff --exit-code -- supabase/migrations/00014_public_release_dataset.sql

      - name: Apply all migrations and check release invariants
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: bash scripts/test-migrations.sh

name: Deploy

# Ships Lunhaw to production: database migrations -> API (Cloudflare Worker) -> website (Cloudflare Pages).
# Runs on every push to main and can be started by hand from the Actions tab.
# One-time setup (secrets and variables) is described in docs/RELEASE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  config:
    name: Check deploy configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          API_URL: ${{ vars.API_URL }}
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD \
                   SUPABASE_SERVICE_ROLE_KEY SUPABASE_PROJECT_REF SUPABASE_URL SUPABASE_ANON_KEY API_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Missing configuration:$missing (see docs/RELEASE.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  database:
    name: Apply database migrations
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Push migrations (never the local seed)
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

  api:
    name: Deploy API (Cloudflare Worker)
    needs: database
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set Worker secrets
        working-directory: apps/api
        run: |
          printf '%s' "${{ vars.SUPABASE_URL }}" | pnpm exec wrangler secret put SUPABASE_URL --env production
          printf '%s' "${{ vars.SUPABASE_ANON_KEY }}" | pnpm exec wrangler secret put SUPABASE_ANON_KEY --env production
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
      - name: Deploy
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env production

  web:
    name: Deploy website (Cloudflare Pages)
    needs: api
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: pnpm --filter web build
      - name: Deploy to Pages
        working-directory: apps/api
        run: pnpm exec wrangler pages deploy ../web/out --project-name lunhaw --branch main --commit-dirty=true

  smoke:
    name: Smoke-test production
    needs: web
    runs-on: ubuntu-latest
    steps:
      - name: API serves the directory from the database
        run: |
          body=$(curl -fsS "${{ vars.API_URL }}/v1/places?per_page=100")
          count=$(echo "$body" | jq '.data.places | length')
          verified=$(echo "$body" | jq '[.data.places[] | select(.verification.status == "VERIFIED")] | length')
          echo "places=$count verified=$verified"
          [ "$count" -gt 0 ]
      - name: Website pages are up
        run: |
          for path in / /home /privacy /terms; do
            curl -fsS -o /dev/null "https://lunhaw.pages.dev$path" && echo "ok $path"
          done

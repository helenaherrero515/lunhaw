<section class="scene-sec rev" id="libraries">

      <canvas id="lib-canvas" role="img" aria-label="Interactive 3D library with books dropping onto stacks and a few floating around it. Drag sideways to rotate."></canvas>
      <div class="fb"><span class="mascot" role="img" aria-label="Lunhaw grasshopper mascot"></span></div>

    </div>
  </div>
</section>

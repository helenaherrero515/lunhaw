[project]
name = "lunhaw-green-index"
version = "1.0.0"
description = "Computes Lunhaw's Green Index (EQ-005) per place from open satellite and OpenStreetMap data."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "rasterio>=1.4,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.7,<4",
  "pystac-client>=0.8,<1",
  "planetary-computer>=1.0,<2",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

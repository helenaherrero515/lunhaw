# Supabase local development configuration
project_id = "lunhaw"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

# Branded account emails. Edit scripts/email/auth-emails.mjs, then run it (add --apply to update the hosted project).
[auth.email.template.confirmation]
subject = "Confirm your email for Lunhaw"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Lunhaw password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Lunhaw sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email for Lunhaw"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You're invited to Lunhaw"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your Lunhaw verification code"
content_path = "./supabase/templates/reauthentication.html"


[analytics]
enabled = false
